<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xuất thứ trong tuần</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: "Times New Roman", Times, serif;
        }

        body {
            padding-top: 30px;
            display: flex;
            justify-content: center;
            background-color: #f9f9f9;
        }

        table {
            border-collapse: collapse;
            background-color: #ffd2cc;
            border: 3px solid #000080;
            width: 500px;
        }

        td {
            border: 1.5px solid #000080;
            padding: 6px 8px;
            font-size: 16px;
            font-weight: bold;
        }

        .input-row {
            white-space: nowrap;
        }

        .input-row input {
            font-family: Arial, sans-serif;
            font-size: 14px;
            padding: 2px 4px;
            border: 1px solid #7a7a7a;
            outline: none;
        }

        #ngay {
            width: 100px;
        }

        #thang {
            width: 55px;
        }

        #nam {
            width: 110px;
            border: 1.5px solid #4a90e2;
        }

        .btn-row {
            text-align: center;
            padding: 4px 0;
        }

        input[type="button"] {
            padding: 2px 14px;
            border-radius: 12px;
            border: 1px solid #7ba5d1;
            background: linear-gradient(to bottom, #ffffff, #d9e8fb);
            font-size: 13px;
            font-weight: bold;
            font-family: Arial, sans-serif;
            cursor: pointer;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.2);
        }

        input[type="button"]:hover {
            background: #c7dcf7;
        }

        .result-row {
            text-align: center;
            font-size: 20px;
            font-weight: normal;
            color: #000;
            padding: 8px 4px;
            min-height: 40px;
        }
    </style>
</head>
<body>

    <form id="dateForm">
        <table>
            <tr>
                <td class="input-row">
                    <label for="ngay">Ngày </label>
                    <input type="number" id="ngay" min="1" max="31" value="12">

                    <label for="thang"> Tháng Select: </label>
                    <input type="number" id="thang" min="1" max="12" value="1">

                    <label for="nam"> năm </label>
                    <input type="number" id="nam" value="2015">
                </td>
            </tr>
            <tr>
                <td class="btn-row">
                    <input type="button" value="Xuất thứ" onclick="xuatThu()">
                </td>
            </tr>
            <tr>
                <td class="result-row" id="ketQua">
                    Thứ 2 Ngày 12 tháng 1 năm 2015
                </td>
            </tr>
        </table>
    </form>

    <script src="6651071004_JAVASCRIPT_cau24.js"></script>
</body>
</html>
