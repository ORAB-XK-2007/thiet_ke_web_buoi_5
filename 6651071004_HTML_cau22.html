<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phép tính Nhân và Chia</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #f9f9f9;
            padding-top: 30px;
            display: flex;
            justify-content: center; 
        }

        .calculator-container {
            border: 1px solid #b5b5b5;
            background-color: #fff;
            padding: 15px 25px;
            width: 320px;
        }

        .form-group {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 10px;
        }

        .form-group label {
            font-size: 16px;
        }

        .form-group input {
            width: 170px;
            padding: 4px 6px;
            font-size: 15px;
            border: 1px solid #7a7a7a;
            outline: none;
        }

        .buttons-group {
            margin: 12px 0 15px 0;
            display: flex;
            gap: 8px;
            justify-content: center;
        }

        button {
            padding: 4px 14px;
            font-size: 14px;
            cursor: pointer;
            background: #f0f0f0;
            border: 1px solid #8f8f8f;
            border-radius: 3px;
        }

        button:hover {
            background-color: #e5e5e5;
        }

        .result-box {
            margin-top: 10px;
            font-size: 16px;
        }

        #resultText {
            margin-top: 6px;
            font-weight: bold;
            font-size: 18px;
            min-height: 24px;
        }
    </style>
</head>
<body>

    <div class="calculator-container">
        <form>
            <div class="form-group">
                <label for="firstNum">1st Number : </label>
                <input type="number" id="firstNum">
            </div>
            
            <div class="form-group">
                <label for="secondNum">2nd Number: </label>
                <input type="number" id="secondNum">
            </div>
            
            <div class="buttons-group">
                <button type="button" onclick="multiply()">Multiply</button>
                <button type="button" onclick="divide()">Divide</button>
            </div>
        </form>

        <div class="result-box">
            <span>The Result Is : </span>
            <span id="resultText"></span>
        </div>
    </div>

    <script src="6651071004_JAVASCRIPT_cau1.js"></script>
</body>
</html>
